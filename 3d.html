const MIX=[]; let LOADED=0; const TOTAL=5;
function upHint(){ const h=document.getElementById('hint');
  h.textContent = LOADED<TOTAL ? '住人を呼んでいます… '+LOADED+'/'+TOTAL : 'PC: WASD移動・ドラッグ視点・ホイールzoom・Q/E回転　スマホ: 1本指移動・2本指ズーム回転'; }
function person(file){
  const g=new THREE.Group();
  const sh=new THREE.Mesh(new THREE.CircleGeometry(0.65,12),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.15}));
  sh.rotation.x=-Math.PI/2; sh.position.y=0.02; g.add(sh);
  new THREE.GLTFLoader().load('assets/'+file, function(gltf){
    const m=gltf.scene;
    const box=new THREE.Box3().setFromObject(m);
    const s=2.4/(box.max.y-box.min.y);
    m.scale.setScalar(s); m.position.y=-box.min.y*s;
    g.add(m);
    const mixer=new THREE.AnimationMixer(m);
    const find=n=>gltf.animations.find(c=>c.name===n)||gltf.animations.find(c=>c.name.toLowerCase().indexOf(n.toLowerCase())>=0);
    const idle=mixer.clipAction(find('Idle'));
    const walk=mixer.clipAction(find('Walking_A')||find('Running_A')||find('Idle'));
    idle.play();
    g.userData.a={mixer,idle,walk,cur:'idle'};
    MIX.push(mixer);
    LOADED++; upHint();
  }, undefined, function(e){ console.error(file,e); LOADED++; upHint(); });
  scene.add(g); return g;
}
function setAnim(g,to){
  const a=g.userData.a; if(!a||a.cur===to)return;
  const f=a.cur==='walk'?a.walk:a.idle, t=to==='walk'?a.walk:a.idle;
  f.fadeOut(0.25); t.reset().fadeIn(0.25).play(); a.cur=to;
}

const V=new THREE.Vector3();
function place(el,wx,wy,wz,txt){
  V.set(wx,wy,wz).project(camera);
  if(V.z>1){ el.style.display='none'; return; }
  el.style.display='block';
  if(txt!==undefined) el.textContent=txt;
  el.style.left=((V.x*0.5+0.5)*innerWidth)+'px';
  el.style.top=((-V.y*0.5+0.5)*innerHeight)+'px';
}

let talking=null, dq=[], nearNPC=null, choicesOpen=false;
const dlgEl=document.getElementById('dlg'), dlgName=document.getElementById('dlgName'),
      dlgText=document.getElementById('dlgText'), dlgChoices=document.getElementById('dlgChoices'),
      dlgHint=document.getElementById('dlgHint');
function talkTo(n){
  if(talking||!n)return;
  talking=n; choicesOpen=false; n.asked=false;
  n.prompt.style.display='none'; n.bub.style.display='none';
  dq=n.lines.map(t=>({n:n.name,t:t}));
  nextDlg();
}
function nextDlg(){
  if(dq.length){
    const it=dq.shift();
    dlgName.textContent=it.n; dlgText.textContent=it.t;
    dlgChoices.innerHTML=''; dlgHint.style.display='block';
    dlgEl.style.display='block';
    return;
  }
  if(talking.ask && !talking.asked){ showChoices(); return; }
  closeDlg();
}
function showChoices(){
  choicesOpen=true; talking.asked=true;
  dlgName.textContent=talking.name; dlgText.textContent='……なにか話してみる？';
  dlgHint.style.display='none'; dlgChoices.innerHTML='';
  talking.ask.concat([{q:'またね！',a:null}]).forEach(o=>{
    const b=document.createElement('button'); b.className='chc'; b.textContent=o.q;
    b.addEventListener('click',ev=>{
      ev.stopPropagation();
      choicesOpen=false; dlgChoices.innerHTML=''; dlgHint.style.display='block';
      if(o.a===null) dq=[{n:'ヒロ',t:'またね！'}];
      else dq=[{n:'ヒロ',t:o.q},{n:talking.name,t:o.a}];
      nextDlg();
    });
    dlgChoices.appendChild(b);
  });
}
function advanceDlg(){ if(!talking||choicesOpen)return; nextDlg(); }
function closeDlg(){ talking=null; choicesOpen=false; dlgEl.style.display='none'; }
dlgEl.addEventListener('click',advanceDlg);

const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true; if(e.key.startsWith('Arrow'))e.preventDefault();
  if(e.key.toLowerCase()==='f'||e.key==='Enter'){
    if(talking) advanceDlg(); else if(nearNPC) talkTo(nearNPC);
  }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
let camTh=0, camPh=0.6, camD=16;
addEventListener('wheel',e=>{ camD=Math.max(6,Math.min(34,camD*(1+e.deltaY*0.001))); },{passive:true});
let drag=null;
renderer.domElement.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY}; });
addEventListener('mousemove',e=>{ if(!drag)return;
  camTh-=(e.clientX-drag.x)*0.005;
  camPh=Math.max(0.15,Math.min(1.35,camPh+(e.clientY-drag.y)*0.005));
  drag={x:e.clientX,y:e.clientY}; });
addEventListener('mouseup',()=>{ drag=null; });
let touch=null, tvec={x:0,y:0}, pinch=null;
function pd(e){ const a=e.touches[0],b=e.touches[1]; return {d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), x:(a.clientX+b.clientX)/2}; }
addEventListener('touchstart',e=>{
  if(e.touches.length>=2){ pinch=pd(e); touch=null; tvec.x=0; tvec.y=0; }
  else { const t=e.touches[0]; touch={x:t.clientX,y:t.clientY}; } },{passive:true});
addEventListener('touchmove',e=>{
  if(e.touches.length>=2&&pinch){ const n=pd(e);
    camD=Math.max(6,Math.min(34,camD*(pinch.d/Math.max(n.d,1))));
    camTh-=(n.x-pinch.x)*0.008; pinch=n; return; }
  if(!touch)return; const t=e.touches[0];
  tvec.x=(t.clientX-touch.x)/50; tvec.y=(t.clientY-touch.y)/50;
  const l=Math.hypot(tvec.x,tvec.y); if(l>1){tvec.x/=l;tvec.y/=l;} },{passive:true});
addEventListener('touchend',e=>{
  if(e.touches.length<2)pinch=null;
  if(e.touches.length===0){ touch=null; tvec.x=0; tvec.y=0; } });
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

const skyK=[[0,[0xBE,0xE0,0xEC]],[0.36,[0xBE,0xE0,0xEC]],[0.44,[0xF2,0xA6,0x5E]],[0.52,[0x18,0x22,0x38]],[0.78,[0x18,0x22,0x38]],[0.86,[0xF4,0xC8,0x9A]],[0.92,[0xBE,0xE0,0xEC]],[1,[0xBE,0xE0,0xEC]]];
const nightK=[[0,0],[0.38,0],[0.52,1],[0.78,1],[0.90,0],[1,0]];
function keyed(K,t){ for(let i=0;i<K.length-1;i++) if(t>=K[i][0]&&t<=K[i+1][0]){ const u=(t-K[i][0])/(K[i+1][0]-K[i][0]); return [K[i][1],K[i+1][1],u]; } return [K[0][1],K[0][1],0]; }
const CY=90;

let last=performance.now(), T=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now; T+=dt;
  const t=(T%CY)/CY;
  const [a,b,u]=keyed(skyK,t);
  const r=Math.round(a[0]+(b[0]-a[0])*u), g2=Math.round(a[1]+(b[1]-a[1])*u), b2=Math.round(a[2]+(b[2]-a[2])*u);
  const sky=(r<<16)|(g2<<8)|b2;
  renderer.setClearColor(sky); scene.fog.color.setHex(sky);
  const [na,nb,nu]=keyed(nightK,t); const night=na+(nb-na)*nu;
  sun.intensity=0.9*(1-night*0.85); hemi.intensity=0.9-night*0.55;
  fireLight.intensity=night*(1.6+Math.sin(T*11)*0.4);
  fire.scale.y=0.9+0.25*Math.abs(Math.sin(T*9))+0.4*night;
  winMats.forEach(m=>m.color.setHex(night>0.5?0xFFE28A:0xF7C948));

  MIX.forEach(m=>m.update(dt));
  CLOUDS.forEach(c=>{ c.position.x+=0.5*dt; if(c.position.x>70)c.position.x=-70; });
  let mx=talking?0:(keys['a']||keys['arrowleft']?-1:0)+(keys['d']||keys['arrowright']?1:0)+tvec.x;
  let mz=talking?0:(keys['w']||keys['arrowup']?-1:0)+(keys['s']||keys['arrowdown']?1:0)+tvec.y;
  const ml=Math.hypot(mx,mz);
  if(keys['q'])camTh+=1.8*dt;
  if(keys['e'])camTh-=1.8*dt;
  if(ml>0.01){
    mx/=Math.max(ml,1); mz/=Math.max(ml,1);
    const wx=mx*Math.cos(camTh)+mz*Math.sin(camTh);
    const wz=-mx*Math.sin(camTh)+mz*Math.cos(camTh);
    player.position.x=Math.max(-55,Math.min(55,player.position.x+wx*7*dt));
    player.position.z=Math.max(-42,Math.min(50,player.position.z+wz*7*dt));
    player.rotation.y=Math.atan2(wx,wz);
    setAnim(player,'walk');
  } else setAnim(player,'idle');

  const ctx2=player.position.x+camD*Math.sin(camTh)*Math.cos(camPh);
  const cty=camD*Math.sin(camPh)+1.5;
  const ctz=player.position.z+camD*Math.cos(camTh)*Math.cos(camPh);
  camera.position.x+=(ctx2-camera.position.x)*0.15;
  camera.position.y+=(cty-camera.position.y)*0.15;
  camera.position.z+=(ctz-camera.position.z)*0.15;
  camera.lookAt(player.position.x, 1.8, player.position.z);

  nearNPC=null;
  npcs.forEach(n=>{
    const frozen = talking===n;
    if(!frozen){
      if(n.ph==='wait'){ n.tm-=dt; if(n.tm<=0){ n.i=(n.i+1)%n.wp.length; n.ph='move'; } }
      else{ const dx=n.wp[n.i][0]-n.x, dz=n.wp[n.i][1]-n.z, d=Math.hypot(dx,dz);
        if(d<0.15){ n.x=n.wp[n.i][0]; n.z=n.wp[n.i][1]; n.ph='wait'; n.tm=Math.max(n.wp[n.i][3],0.1); }
        else{ n.x+=dx/d*n.sp*dt; n.z+=dz/d*n.sp*dt; n.g.rotation.y=Math.atan2(dx,dz); } }
    }
    n.g.position.set(n.x, 0, n.z);
    setAnim(n.g, (!frozen&&n.ph==='move')?'walk':'idle');
    const pdn=Math.hypot(player.position.x-n.x, player.position.z-n.z);
    const inRange = pdn<5 && !talking;
    if(inRange){ nearNPC=nearNPC||n; n.g.rotation.y=Math.atan2(player.position.x-n.x, player.position.z-n.z); }
    if(frozen){ n.g.rotation.y=Math.atan2(player.position.x-n.x, player.position.z-n.z); place(n.prompt,n.x,3.4,n.z,''); n.prompt.style.display='none'; n.bub.style.display='none'; return; }
    if(inRange){ place(n.prompt,n.x,3.9,n.z,'話す [F]'); n.bub.style.display='none'; return; }
    n.prompt.style.display='none';
    let txt=null;
    if(n.ph==='wait'&&n.wp[n.i][2]) txt=n.wp[n.i][2];
    if(txt) place(n.bub,n.x,3.4,n.z,txt); else n.bub.style.display='none';
  });

  steams.forEach(s=>{ const y=s.b+((T+s.p)%3)*0.8; s.m.position.y=y; s.m.material.opacity=0.6*(1-((T+s.p)%3)/3); });
  cat.position.y=0; cat.rotation.y=Math.sin(T*0.6)*0.6;
  dog.position.x=-3+Math.sin(T*0.9)*3; dog.rotation.y=Math.cos(T*0.9)>0?Math.PI/2:-Math.PI/2;
  dog.position.y=Math.abs(Math.sin(T*8))*0.1;
  dogTail.rotation.y=Math.sin(T*13)*0.7;
  const pdc=Math.hypot(player.position.x-cat.position.x-3+3, player.position.z-cat.position.z);
  const pcat=Math.hypot(player.position.x-3, player.position.z+15.5);
  if(pcat<4) place(catB,3,1.6,-15.5,'にゃー'); else catB.style.display='none';
  const pdog=Math.hypot(player.position.x-dog.position.x, player.position.z+14.5);
  if(pdog<4) place(dogB,dog.position.x,1.8,-14.5,'わん！'); else dogB.style.display='none';
  deer.position.x=-32+Math.sin(T*0.25)*5; deer.rotation.y=Math.cos(T*0.25)>0?Math.PI/2:-Math.PI/2;
  const bt=T%20; let by=-1.6;
  if(bt>=12&&bt<13) by=-1.6+(bt-12)*1.6; else if(bt>=13&&bt<17) by=0; else if(bt>=17&&bt<18) by=-(bt-17)*1.6;
  bear.position.y=by;
  if(by===0) place(bearB,33,3.3,5.5,'こんにちは'); else bearB.style.display='none';
  mky.position.y=Math.abs(Math.sin(T*2.2))*0.2; mky2.position.y=Math.abs(Math.sin(T*2.2+1))*0.15;
  const vspan=44, vp=(T*3)%(vspan*2), vx=vp<vspan?-22+vp:-22+vspan*2-vp;
  van.position.x=vx; van.rotation.y=vp<vspan?0:Math.PI;
  robot.position.y=Math.abs(Math.sin(T*3))*0.15;

  plc.forEach(p=>place(p.d,p.v.x,p.v.y,p.v.z));
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

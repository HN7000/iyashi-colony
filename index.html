<script>
const $=i=>document.getElementById(i);
const lerp=(a,b,u)=>a+(b-a)*u;
function hx(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,u){const A=hx(a),B=hx(b);return 'rgb('+Math.round(lerp(A[0],B[0],u))+','+Math.round(lerp(A[1],B[1],u))+','+Math.round(lerp(A[2],B[2],u))+')'}
function keyed(keys,t){for(let i=0;i<keys.length-1;i++){if(t>=keys[i][0]&&t<=keys[i+1][0]){const u=(t-keys[i][0])/(keys[i+1][0]-keys[i][0]);return [keys[i][1],keys[i+1][1],u]}}return [keys[0][1],keys[0][1],0]}
const skyK=[[0,'#BEE0EC'],[0.36,'#BEE0EC'],[0.44,'#F2A65E'],[0.52,'#182238'],[0.78,'#182238'],[0.86,'#F4C89A'],[0.92,'#BEE0EC'],[1,'#BEE0EC']];
const nightK=[[0,0],[0.38,0],[0.52,1],[0.78,1],[0.90,0],[1,0]];
const CY=48;
const chars=[
{g:'c1',x:340,y:252,wp:[[340,252,'いってきます',1.6],[310,468,null,0.2],[240,332,'野菜が元気！',3],[310,468,null,0.2],[208,500,'いい湯だなあ',3.5],[310,468,null,0.2],[340,252,'ただいま',2.5]]},
{g:'c2',x:372,y:470,wp:[[372,470,'ごはんにしよう',2.2],[516,278,'AIが動いたよ',3.5],[372,470,null,0.8],[468,428,'こんにちは',3],[372,470,null,1]]},
{g:'c3',x:190,y:510,wp:[[190,510,'ふう、極楽',4],[340,486,'いいにおい！',2.8],[560,432,'野菜ください',3],[340,486,null,0.5]]},
{g:'c4',x:612,y:432,wp:[[612,432,'いらっしゃい！',2.4],[612,432,null,6]]}
];
chars.forEach(c=>{c.i=0;c.ph='wait';c.tm=1+Math.random()*2;c.fx=1});
function bub(c,txt){const b=$(c.g+'b'),r=$(c.g+'br'),t=$(c.g+'bt');if(!txt){b.setAttribute('opacity','0');return}const w=txt.length*13+16;r.setAttribute('x',-w/2);r.setAttribute('width',w);t.textContent=txt;b.setAttribute('opacity','1')}
let last=null,T=0;
function frame(ts){
if(last===null)last=ts;let dt=Math.min((ts-last)/1000,0.05);last=ts;T+=dt;
const t=(T%CY)/CY;
const [a,b,u]=keyed(skyK,t);$('sky').setAttribute('fill',mix(a,b,u));
const [na,nb,nu]=keyed(nightK,t);const night=lerp(na,nb,nu);
$('nite').setAttribute('opacity',(0.32*night).toFixed(3));
$('stars').setAttribute('opacity',night.toFixed(2));
$('glow').setAttribute('opacity',(0.22*night).toFixed(3));
const dayT=((t-0.90+1)%1)/0.50, moonT=((t-0.44+1)%1)/0.42;
if(dayT>=0&&dayT<=1){$('sun').setAttribute('opacity','1');$('sun').setAttribute('cx',-40+dayT*760);$('sun').setAttribute('cy',95-Math.sin(Math.PI*dayT)*62)}else $('sun').setAttribute('opacity','0');
